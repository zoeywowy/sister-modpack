<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pack.toml · raw view</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Fira Code', 'Cascadia Code', monospace;
      padding: 1.5rem;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: #161b22;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      border: 1px solid #30363d;
      transition: box-shadow 0.2s;
    }
    .header {
      background: #0d1117;
      padding: 1rem 1.8rem;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .header h1 {
      color: #f0f6fc;
      font-weight: 500;
      font-size: 1.3rem;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 span {
      background: #21262d;
      padding: 0.15rem 0.7rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 400;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    .badge {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }
    .badge .status {
      font-size: 0.8rem;
      background: #21262d;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    .badge .status.loading {
      color: #f0e6a0;
      border-color: #d4a72c;
    }
    .badge .status.success {
      color: #7ee787;
      border-color: #238636;
    }
    .badge .status.error {
      color: #f85149;
      border-color: #da3633;
    }
    .badge .raw-link {
      background: #21262d;
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      border: 1px solid #30363d;
      color: #8b949e;
      text-decoration: none;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .badge .raw-link:hover {
      background: #30363d;
      color: #f0f6fc;
      border-color: #58a6ff;
    }
    .badge .raw-link i {
      font-style: normal;
      font-weight: 400;
    }
    .code-wrapper {
      background: #0d1117;
      padding: 1.2rem 0;
      position: relative;
    }
    pre {
      background: transparent;
      color: #e6edf3;
      padding: 0 1.8rem 1.5rem 1.8rem;
      margin: 0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-x: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: #30363d #0d1117;
    }
    pre::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    pre::-webkit-scrollbar-track {
      background: #0d1117;
    }
    pre::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 8px;
    }
    pre::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }
    .line-numbers {
      display: none; /* we keep it clean, but we add a subtle hint */
    }
    .footer-note {
      background: #0d1117;
      border-top: 1px solid #21262d;
      padding: 0.7rem 1.8rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #484f58;
      flex-wrap: wrap;
      gap: 0.3rem 1rem;
    }
    .footer-note a {
      color: #58a6ff;
      text-decoration: none;
    }
    .footer-note a:hover {
      text-decoration: underline;
    }
    .timestamp {
      color: #484f58;
      font-feature-settings: "tnum";
    }
    .copy-btn {
      background: transparent;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.2rem 0.8rem;
      border-radius: 16px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.15s;
      font-family: inherit;
    }
    .copy-btn:hover {
      background: #21262d;
      border-color: #58a6ff;
      color: #f0f6fc;
    }
    .copy-btn.copied {
      border-color: #238636;
      color: #7ee787;
    }
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: stretch;
      }
      .badge {
        flex-wrap: wrap;
      }
      pre {
        font-size: 0.8rem;
        padding: 0 1rem 1rem 1rem;
      }
      .footer-note {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <div class="header">
    <h1>
      📄 pack.toml
      <span>raw</span>
    </h1>
    <div class="badge">
      <span class="status loading" id="statusBadge">⟳ loading</span>
      <button class="copy-btn" id="copyBtn" title="copy raw content">📋 copy</button>
      <a class="raw-link" href="https://raw.githubusercontent.com/zoeywowy/sister-modpack/refs/heads/main/pack.toml" target="_blank" rel="noopener">
        <i>↗</i> source
      </a>
    </div>
  </div>

  <div class="code-wrapper">
    <pre id="tomlOutput"><span style="color:#8b949e">// fetching from GitHub …</span></pre>
  </div>

  <div class="footer-note">
    <span>⚡ auto‑updates every <span id="refreshInterval">60</span>s · <span id="nextRefresh">—</span></span>
    <span class="timestamp" id="lastFetch">last fetch: —</span>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ----- configuration -----
    const TOML_RAW_URL = 'https://raw.githubusercontent.com/zoeywowy/sister-modpack/refs/heads/main/pack.toml';
    const REFRESH_INTERVAL_SECONDS = 60; // 60 seconds = 1 minute

    // ----- DOM elements -----
    const preElem = document.getElementById('tomlOutput');
    const statusBadge = document.getElementById('statusBadge');
    const lastFetchSpan = document.getElementById('lastFetch');
    const nextRefreshSpan = document.getElementById('nextRefresh');
    const refreshIntervalSpan = document.getElementById('refreshInterval');
    const copyBtn = document.getElementById('copyBtn');

    // ----- state -----
    let currentContent = '';          // stores the last successful fetch content
    let fetchTimer = null;
    let countdownInterval = null;
    let secondsUntilRefresh = REFRESH_INTERVAL_SECONDS;

    // ----- helper: format timestamp -----
    function formatTimestamp(date) {
      if (!date) return '—';
      return date.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    // ----- update UI with content (and optional status) -----
    function renderContent(content, status = 'success', message = '') {
      if (content !== null && content !== undefined) {
        // preserve raw TOML: we display exactly what we got
        preElem.textContent = content;
        currentContent = content;
      } else {
        // fallback: show a placeholder
        preElem.textContent = '⚠️  unable to load pack.toml — check network or URL.';
        currentContent = '';
      }

      // update status badge
      statusBadge.className = 'status ' + status;
      if (status === 'loading') {
        statusBadge.textContent = '⟳ ' + (message || 'loading');
      } else if (status === 'success') {
        statusBadge.textContent = '✓ ' + (message || 'live');
      } else if (status === 'error') {
        statusBadge.textContent = '✗ ' + (message || 'error');
      } else {
        statusBadge.textContent = message || '—';
      }

      // update last fetch timestamp
      const now = new Date();
      lastFetchSpan.textContent = 'last fetch: ' + formatTimestamp(now);
    }

    // ----- fetch the TOML file -----
    async function fetchToml() {
      // set loading state (but keep previous content visible)
      statusBadge.className = 'status loading';
      statusBadge.textContent = '⟳ fetching…';

      try {
        const response = await fetch(TOML_RAW_URL, {
          cache: 'no-store',   // we want fresh data each time
          headers: { 'Accept': 'text/plain' }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText}`);
        }

        const text = await response.text();
        // If the response is empty, treat as error (pack.toml should not be empty)
        if (text.trim() === '') {
          throw new Error('empty response from server');
        }

        // success: update with new content
        renderContent(text, 'success', 'live');
        return true;
      } catch (err) {
        console.warn('[pack.toml viewer] fetch error:', err);
        // On error, we keep the previous content if any, else show error placeholder
        if (currentContent) {
          // keep showing old content but mark error
          renderContent(currentContent, 'error', 'fetch failed — retrying');
        } else {
          // no previous content: show error message in pre
          preElem.textContent = '❌  Failed to load pack.toml\n' +
                               '   URL: ' + TOML_RAW_URL + '\n' +
                               '   Error: ' + err.message + '\n\n' +
                               '   Check network or if the file exists.';
          renderContent(null, 'error', 'error');
        }
        return false;
      }
    }

    // ----- refresh cycle: fetch + reset countdown -----
    function refreshCycle() {
      // reset countdown
      secondsUntilRefresh = REFRESH_INTERVAL_SECONDS;
      updateCountdownDisplay();

      // perform fetch (does not block)
      fetchToml().then(() => {
        // after fetch, we update the countdown display again (already updated)
        // but we also make sure the status is correct if fetch failed
      }).catch(() => {
        // ignore, already handled inside fetchToml
      });
    }

    // ----- countdown tick -----
    function tickCountdown() {
      if (secondsUntilRefresh > 0) {
        secondsUntilRefresh--;
      }
      updateCountdownDisplay();
    }

    // ----- update the countdown display (next refresh) -----
    function updateCountdownDisplay() {
      const now = new Date();
      const nextDate = new Date(now.getTime() + secondsUntilRefresh * 1000);
      nextRefreshSpan.textContent = 'next: ' + formatTimestamp(nextDate);
      // also update interval display (static, but we set it once)
      refreshIntervalSpan.textContent = REFRESH_INTERVAL_SECONDS;
    }

    // ----- copy to clipboard -----
    function copyRawContent() {
      const textToCopy = currentContent || preElem.textContent || '';
      if (!textToCopy || textToCopy.startsWith('// fetching') || textToCopy.includes('unable to load')) {
        // avoid copying placeholder/error messages
        copyBtn.textContent = '⚠️ empty';
        setTimeout(() => { copyBtn.textContent = '📋 copy'; }, 1200);
        return;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy)
          .then(() => {
            copyBtn.textContent = '✅ copied!';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.textContent = '📋 copy';
              copyBtn.classList.remove('copied');
            }, 2000);
          })
          .catch(() => {
            fallbackCopy(textToCopy);
          });
      } else {
        fallbackCopy(textToCopy);
      }
    }

    // fallback copy method
    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        const success = document.execCommand('copy');
        if (success) {
          copyBtn.textContent = '✅ copied!';
          setTimeout(() => { copyBtn.textContent = '📋 copy'; }, 2000);
        } else {
          copyBtn.textContent = '⚠️ failed';
          setTimeout(() => { copyBtn.textContent = '📋 copy'; }, 1500);
        }
      } catch (e) {
        copyBtn.textContent = '⚠️ error';
        setTimeout(() => { copyBtn.textContent = '📋 copy'; }, 1500);
      }
      document.body.removeChild(textarea);
    }

    // ----- initialize -----
    function init() {
      // set interval display
      refreshIntervalSpan.textContent = REFRESH_INTERVAL_SECONDS;

      // initial fetch + start timers
      refreshCycle(); // fetches and sets countdown

      // start countdown timer (every second)
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        tickCountdown();
      }, 1000);

      // start refresh timer (every REFRESH_INTERVAL_SECONDS)
      if (fetchTimer) clearInterval(fetchTimer);
      fetchTimer = setInterval(() => {
        refreshCycle();
      }, REFRESH_INTERVAL_SECONDS * 1000);

      // copy button listener
      copyBtn.addEventListener('click', copyRawContent);

      // optional: click on status badge to force refresh (handy)
      statusBadge.addEventListener('dblclick', function() {
        refreshCycle();
        statusBadge.textContent = '⟳ manual';
        setTimeout(() => {
          if (statusBadge.className.includes('success')) {
            statusBadge.textContent = '✓ live';
          } else if (statusBadge.className.includes('error')) {
            statusBadge.textContent = '✗ error';
          } else {
            statusBadge.textContent = '⟳ loading';
          }
        }, 300);
      });
    }

    // start everything when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // clean up on page unload (optional)
    window.addEventListener('beforeunload', function() {
      if (fetchTimer) clearInterval(fetchTimer);
      if (countdownInterval) clearInterval(countdownInterval);
    });

  })();
</script>
</body>
</html>
